# Multi-zone routing at the edge: /loans/* goes straight to the loans zone (no extra hop through
# the shell); everything else to the shell. Both zones independently verify the session.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexbank
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Server-Sent Events (/api/loans/stream) must not be buffered or cut off.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # Basic edge rate limiting (per client IP) in front of the app-level login throttle.
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [lending.example.com]
      secretName: nexbank-tls
  rules:
    - host: lending.example.com
      http:
        paths:
          - path: /loans
            pathType: Prefix
            backend: { service: { name: loans, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: shell, port: { name: http } } }

apiVersion: apps/v1
kind: Deployment
metadata:
  name: shell
  labels: { app.kubernetes.io/name: shell, app.kubernetes.io/component: frontend-zone }
spec:
  # NOTE: the demo BFF keeps loans, SSE subscribers and login throttling in memory. Keep a single
  # replica until those move to a real backend / Redis; then enable the HPA below.
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: shell }
  template:
    metadata:
      labels: { app.kubernetes.io/name: shell, app.kubernetes.io/component: frontend-zone }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: shell
          image: nexbank/shell
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - name: SESSION_SECRET
              valueFrom: { secretKeyRef: { name: nexbank-session, key: SESSION_SECRET } }
            - name: NODE_OPTIONS
              value: "--max-old-space-size=384"
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            # Next.js writes its image/fetch cache here; everything else is read-only.
            - { name: next-cache, mountPath: /app/apps/shell/.next/cache }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: next-cache, emptyDir: { sizeLimit: 256Mi } }
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: shell
  labels: { app.kubernetes.io/name: shell }
spec:
  selector: { app.kubernetes.io/name: shell }
  ports:
    - { name: http, port: 3000, targetPort: http }

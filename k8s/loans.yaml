apiVersion: apps/v1
kind: Deployment
metadata:
  name: loans
  labels: { app.kubernetes.io/name: loans, app.kubernetes.io/component: frontend-zone }
spec:
  # Stateless zone (data comes from the BFF) — scales horizontally.
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: loans }
  template:
    metadata:
      labels: { app.kubernetes.io/name: loans, app.kubernetes.io/component: frontend-zone }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: loans }
      containers:
        - name: loans
          image: nexbank/loans
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - name: SESSION_SECRET
              valueFrom: { secretKeyRef: { name: nexbank-session, key: SESSION_SECRET } }
            - name: NODE_OPTIONS
              value: "--max-old-space-size=384"
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          startupProbe:
            httpGet: { path: /loans/api/health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /loans/api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /loans/api/health, port: http }
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: next-cache, mountPath: /app/apps/loans/.next/cache }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: next-cache, emptyDir: { sizeLimit: 256Mi } }
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: loans
  labels: { app.kubernetes.io/name: loans }
spec:
  selector: { app.kubernetes.io/name: loans }
  ports:
    - { name: http, port: 3000, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: loans
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: loans }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: loans
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: loans }
